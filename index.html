<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านยาจำลอง — หน้าแรก</title>
<style>
  :root{
    --bg:#eaf3fd; --card:#ffffff; --ink:#16324f; --ink-2:#5a7691; --line:#d3e4f6;
    --blue:#3f86d4; --blue-soft:#e3effc;
    --c1:#3f86d4; --c1s:#e3effc;   /* ขายยา */
    --c2:#7a6fd8; --c2s:#ece9fb;   /* ผู้ดูแล */
    --c3:#1fa39a; --c3s:#dff5f3;   /* dashboard */
    --c4:#e8903b; --c4s:#fdeede;   /* สถานะ */
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 380px at 85% -80px,#cfe3fa 0%,transparent 70%),
      radial-gradient(700px 320px at 0% 0,#e1f0ff 0%,transparent 65%),
      linear-gradient(180deg,#eef6ff 0%,#ffffff 70%);
    background-attachment:fixed;
  }
  .wrap{max-width:680px;margin:0 auto;padding:32px 16px 36px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:26px}
  .logo{
    flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(145deg,#5aa0e8,#3a78c8);color:#fff;
    box-shadow:0 6px 16px rgba(58,120,200,.3);
  }
  .logo svg{width:36px;height:36px}
  h1{margin:0;font-size:1.65rem;line-height:1.25}
  header p{margin:4px 0 0;color:var(--ink-2);font-size:1rem}
  .label{margin:0 4px 10px;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
  nav{display:grid;gap:14px}
  .btn{
    --a:var(--c1);--as:var(--c1s);
    position:relative;display:flex;align-items:center;gap:16px;
    min-height:92px;padding:16px 18px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:20px;
    box-shadow:0 2px 6px rgba(63,134,212,.08),0 8px 22px rgba(63,134,212,.08);
    transition:transform .12s,box-shadow .2s,border-color .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;background:var(--a)}
  .btn:hover{border-color:var(--a);transform:translateY(-2px);box-shadow:0 10px 26px rgba(63,134,212,.18)}
  .btn:active{transform:scale(.985);background:var(--as)}
  .btn:focus-visible{outline:3px solid var(--a);outline-offset:3px}
  .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--as);color:var(--a)}
  .ic svg{width:30px;height:30px}
  .tx{flex:1;min-width:0}
  .t{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.2rem;font-weight:700;line-height:1.3}
  .tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--as);color:var(--a)}
  .d{display:block;margin-top:3px;font-size:.95rem;line-height:1.45;color:var(--ink-2)}
  .go{flex:none;width:28px;height:28px;color:var(--a);opacity:.7;transition:transform .15s}
  .btn:hover .go{transform:translateX(3px);opacity:1}
  .note{
    margin-top:24px;display:flex;gap:10px;align-items:center;justify-content:center;
    padding:12px 16px;font-size:.95rem;text-align:center;
    background:#fff;border:1.5px dashed #aac9ee;border-radius:14px;color:var(--ink);
  }
  .note svg{flex:none;width:20px;height:20px;color:var(--blue);display:block}
  footer{margin-top:18px;text-align:center;font-size:.85rem;color:var(--ink-2)}
  @media (max-width:420px){
    h1{font-size:1.4rem}.logo{width:54px;height:54px}.ic{width:48px;height:48px}.t{font-size:1.1rem}
  }
  @media (prefers-reduced-motion:reduce){.btn,.go{transition:none}}
</style>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo" aria-hidden="true"></div>
    <div>
      <h1>ร้านยาจำลอง</h1>
      <p>ระบบ workshop สำหรับเจ้าหน้าที่ร้านยา · เลือกหน้าที่ต้องการ</p>
    </div>
  </header>

  <p class="label">เมนูหลัก</p>
  <nav id="menu" aria-label="เมนูหลัก"></nav>

  <div class="note"><span id="note-ic"></span><span>ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</span></div>
  <footer>Workshop ร้านยาจำลอง · ใช้เพื่อการเรียนเท่านั้น</footer>
</div>
<script>
// รายการลิงก์: เพิ่มหรือลบปุ่มได้ด้วยการแก้ทีละบรรทัดในอาร์เรย์นี้
// ช่องบังคับ: href, title, desc  ช่องเสริม: icon (cart|shield|chart|pulse|file), tag (ป้ายเล็กข้างชื่อ), color (1-4)
const LINKS = [
  { href: 'pos.html',       title: 'หน้าขายยา',            desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา',                  icon: 'cart',   color: 1 },
  { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)', desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล',   icon: 'shield', color: 2, tag: 'ผู้ดูแล' },
  { href: 'dashboard.html', title: 'Dashboard คลังยา',      desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ',      icon: 'chart',  color: 3 },
  { href: 'status.html',    title: 'ตรวจสถานะระบบ',        desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ',              icon: 'pulse',  color: 4 }
];

// ไอคอน SVG (เส้นทางวาดแบบตายตัวในโค้ด ไม่ได้มาจากข้อความในอาร์เรย์)
const PATHS = {
  cart:   ['M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2','M9.5 20.2h.01M17 20.2h.01'],
  shield: ['M12 3l7.5 3v5.5c0 4.6-3.1 7.9-7.5 9.5-4.4-1.6-7.5-4.9-7.5-9.5V6L12 3z','M9 12l2.1 2.1L15.5 9.7'],
  chart:  ['M4 20V10M10 20V4M16 20v-7M22 20H2'],
  pulse:  ['M3 12h4l2.5-6 4 12 2.5-6H21'],
  file:   ['M7 3h7l4 4v14H7z','M14 3v4h4'],
  pill:   ['M10.5 20.5a4.9 4.9 0 0 1-7-7l9-9a4.9 4.9 0 0 1 7 7l-9 9z','M8.5 8.5l7 7'],
  info:   ['M12 8h.01M11 12h1v5h1','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],
  go:     ['M9 5l7 7-7 7']
};
const NS = 'http://www.w3.org/2000/svg';
function icon(name, cls) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '1.9');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  if (cls) s.setAttribute('class', cls);
  (PATHS[name] || PATHS.file).forEach(d => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    s.appendChild(p);
  });
  return s;
}

// สร้างปุ่มด้วย createElement + textContent (ไม่ฝัง HTML จากข้อความในอาร์เรย์)
const menu = document.getElementById('menu');
LINKS.forEach(({ href, title, desc, icon: ic, tag, color }) => {
  const n = [1, 2, 3, 4].includes(color) ? color : 1;
  const a = document.createElement('a');
  a.className = 'btn';
  a.href = href;
  a.style.setProperty('--a', 'var(--c' + n + ')');
  a.style.setProperty('--as', 'var(--c' + n + 's)');

  const box = document.createElement('span');
  box.className = 'ic';
  box.appendChild(icon(ic));

  const tx = document.createElement('span');
  tx.className = 'tx';
  const t = document.createElement('span');
  t.className = 't';
  const tt = document.createElement('span');
  tt.textContent = title;
  t.appendChild(tt);
  if (tag) {
    const g = document.createElement('span');
    g.className = 'tag';
    g.textContent = tag;
    t.appendChild(g);
  }
  const d = document.createElement('span');
  d.className = 'd';
  d.textContent = desc;
  tx.append(t, d);

  a.append(box, tx, icon('go', 'go'));
  menu.appendChild(a);
});
document.getElementById('logo').appendChild(icon('pill'));
document.getElementById('note-ic').appendChild(icon('info'));
</script>
<script src="./mascot.js" defer></script>
</body>
</html>
